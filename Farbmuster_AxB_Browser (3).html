<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Farbmuster</title>
  <style>html { background: #f4f6f8; } body { margin: 0; }</style>
</head>
<body>
<!-- Den gesamten Inhalt dieses Dateikörpers in ein Jimdo-Widget/HTML-Element kopieren. -->
<div id="color-pattern-app">
  <style>
    #color-pattern-app {
      --ink: #20242a;
      --muted: #515a65;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 12px;
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    #color-pattern-app *, #color-pattern-app *::before, #color-pattern-app *::after { box-sizing: border-box; }
    #color-pattern-app h2 { margin: 0 0 8px; font-size: clamp(1.4rem, 4vw, 2rem); }
    #color-pattern-app .cp-intro { margin: 0 0 18px; color: var(--muted); }
    #color-pattern-app .cp-palette, #color-pattern-app .cp-settings, #color-pattern-app .cp-actions {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 9px;
    }
    #color-pattern-app .cp-palette { margin: 0 auto 18px; }
    #color-pattern-app button, #color-pattern-app input {
      font: inherit; color: inherit;
    }
    #color-pattern-app button { cursor: pointer; touch-action: manipulation; }
    #color-pattern-app .cp-color, #color-pattern-app .cp-eraser {
      min-width: 66px; padding: 7px 9px; border: 2px solid #c3c9d0; border-radius: 9px; background: #fff;
    }
    #color-pattern-app .cp-color[aria-pressed="true"], #color-pattern-app .cp-eraser[aria-pressed="true"] {
      border-color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
    }
    #color-pattern-app .cp-swatch { display: block; height: 25px; margin-bottom: 4px; border-radius: 5px; }
    #color-pattern-app .cp-settings { margin: 0 auto 16px; }
    #color-pattern-app .cp-settings label { display: inline-flex; align-items: center; gap: 6px; }
    #color-pattern-app .cp-settings input { width: 76px; min-height: 42px; padding: 6px 8px; border: 1px solid #9ca5af; border-radius: 7px; }
    #color-pattern-app .cp-settings button, #color-pattern-app .cp-actions button {
      min-height: 42px; padding: 8px 13px; border: 1px solid #9ca5af; border-radius: 8px; background: #fff;
    }
    #color-pattern-app .cp-board {
      display: grid; width: 100%; max-width: 600px; min-height: clamp(180px, 30vw, 300px);
      grid-template-columns: repeat(8, minmax(0, 1fr)); grid-auto-rows: 1fr; aspect-ratio: 2 / 1;
      gap: 4px; margin: 0 auto; padding: 4px; border: 1px solid #252a30;
      border-radius: 8px; background: #252a30; overflow: hidden;
    }
    #color-pattern-app .cp-cell { min-width: 0; min-height: 24px; padding: 0; border: 0; border-radius: 3px; background: #fff; }
    #color-pattern-app button:focus-visible, #color-pattern-app input:focus-visible {
      outline: 3px solid #135fbd; outline-offset: 2px;
    }
    #color-pattern-app .cp-actions { margin: 16px auto 0; }
    #color-pattern-app .cp-status { min-height: 1.5em; margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
    @media print {
      #color-pattern-app .cp-intro, #color-pattern-app .cp-palette, #color-pattern-app .cp-settings,
      #color-pattern-app .cp-actions, #color-pattern-app .cp-status { display: none !important; }
      #color-pattern-app { max-width: none; padding: 0; }
      #color-pattern-app .cp-board { width: 100%; border-radius: 0; }
    }
  </style>

  <h2>Farbmuster</h2>
  <p class="cp-intro">Wähle eine Farbe oder den Radiergummi und tippe auf ein Feld.</p>
  <div class="cp-palette" data-palette role="group" aria-label="Farbe auswählen"></div>
  <form class="cp-settings" data-settings>
    <label>Zeilen <input data-rows type="number" min="1" max="20" value="4" inputmode="numeric"></label>
    <label>Spalten <input data-columns type="number" min="1" max="20" value="8" inputmode="numeric"></label>
    <button type="submit">Raster anpassen</button>
  </form>
  <div class="cp-board" data-board role="group" aria-label="Farbfeld mit 4 Zeilen und 8 Spalten">
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 1, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 2, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 3, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 4, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 5, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 6, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 7, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 1, Spalte 8, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 1, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 2, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 3, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 4, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 5, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 6, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 7, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 2, Spalte 8, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 1, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 2, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 3, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 4, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 5, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 6, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 7, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 3, Spalte 8, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 1, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 2, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 3, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 4, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 5, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 6, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 7, leer"></button>
    <button class="cp-cell" type="button" aria-label="Zeile 4, Spalte 8, leer"></button>
  </div>
  <div class="cp-actions" aria-label="Aktionen">
    <button type="button" data-clear>Alle Felder leeren</button>
    <button type="button" data-print>Drucken</button>
    <button type="button" data-fullscreen>Vollbild</button>
  </div>
  <p class="cp-status" data-status role="status" aria-live="polite"></p>

  <script>
    (() => {
      const app = document.getElementById("color-pattern-app");
      if (!app || app.dataset.started) return;
      app.dataset.started = "true";

      const colors = [
        { name: "Gelb", value: "#ffda44" }, { name: "Rot", value: "#eb5757" },
        { name: "Blau", value: "#4285e8" }, { name: "Grün", value: "#56b870" },
        { name: "Lila", value: "#aa7ad8" }, { name: "Orange", value: "#f39b43" }
      ];
      const palette = app.querySelector("[data-palette]");
      const board = app.querySelector("[data-board]");
      const status = app.querySelector("[data-status]");
      const rowsInput = app.querySelector("[data-rows]");
      const columnsInput = app.querySelector("[data-columns]");
      let rows = 4;
      let columns = 8;
      let selectedColor = 0;
      let cells = Array(rows * columns).fill(-1);

      function drawPalette() {
        palette.replaceChildren();
        colors.forEach((color, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cp-color";
          button.setAttribute("aria-pressed", String(selectedColor === index));
          button.setAttribute("aria-label", `${color.name} auswählen`);
          const swatch = document.createElement("span");
          swatch.className = "cp-swatch";
          swatch.style.backgroundColor = color.value;
          swatch.setAttribute("aria-hidden", "true");
          const label = document.createElement("span");
          label.textContent = color.name;
          button.append(swatch, label);
          button.addEventListener("click", () => { selectedColor = index; status.textContent = `${color.name} ausgewählt.`; drawPalette(); });
          palette.append(button);
        });
        const eraser = document.createElement("button");
        eraser.type = "button";
        eraser.className = "cp-eraser";
        eraser.textContent = "⌫ Radiergummi";
        eraser.setAttribute("aria-pressed", String(selectedColor === -1));
        eraser.addEventListener("click", () => { selectedColor = -1; status.textContent = "Radiergummi ausgewählt."; drawPalette(); });
        palette.append(eraser);
      }

      function drawBoard() {
        board.replaceChildren();
        board.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
        board.style.aspectRatio = `${columns} / ${rows}`;
        board.setAttribute("aria-label", `Farbfeld mit ${rows} Zeilen und ${columns} Spalten`);
        cells.forEach((colorIndex, index) => {
          const row = Math.floor(index / columns) + 1;
          const column = index % columns + 1;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cp-cell";
          const update = () => {
            button.style.backgroundColor = colorIndex < 0 ? "#ffffff" : colors[colorIndex].value;
            button.setAttribute("aria-label", `Zeile ${row}, Spalte ${column}${colorIndex < 0 ? ", leer" : `, ${colors[colorIndex].name}`}`);
          };
          update();
          button.addEventListener("click", () => {
            cells[index] = selectedColor;
            colorIndex = selectedColor;
            update();
            status.textContent = selectedColor < 0 ? `Feld in Zeile ${row}, Spalte ${column} geleert.` : `Feld in Zeile ${row}, Spalte ${column}: ${colors[selectedColor].name}.`;
          });
          board.append(button);
        });
      }

      app.querySelector("[data-settings]").addEventListener("submit", event => {
        event.preventDefault();
        const nextRows = Number.parseInt(rowsInput.value, 10);
        const nextColumns = Number.parseInt(columnsInput.value, 10);
        if (!Number.isInteger(nextRows) || !Number.isInteger(nextColumns) || nextRows < 1 || nextRows > 20 || nextColumns < 1 || nextColumns > 20) {
          status.textContent = "Bitte für Zeilen und Spalten jeweils eine Zahl von 1 bis 20 eingeben.";
          return;
        }
        const nextCells = Array(nextRows * nextColumns).fill(-1);
        for (let row = 0; row < Math.min(rows, nextRows); row++) {
          for (let column = 0; column < Math.min(columns, nextColumns); column++) {
            nextCells[row * nextColumns + column] = cells[row * columns + column];
          }
        }
        rows = nextRows;
        columns = nextColumns;
        cells = nextCells;
        drawBoard();
        status.textContent = `Raster auf ${rows} Zeilen und ${columns} Spalten angepasst.`;
      });

      app.querySelector("[data-clear]").addEventListener("click", () => { cells.fill(-1); drawBoard(); status.textContent = "Alle Felder wurden geleert."; });
      app.querySelector("[data-print]").addEventListener("click", () => window.print());
      app.querySelector("[data-fullscreen]").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (app.requestFullscreen) await app.requestFullscreen();
          else status.textContent = "Der Browser unterstützt keinen Vollbildmodus.";
        } catch { status.textContent = "Der Vollbildmodus konnte nicht gestartet werden."; }
      });
      drawPalette();
      drawBoard();
    })();
  </script>
</div>

</body>
</html>
